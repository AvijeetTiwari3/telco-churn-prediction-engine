project:
  name: "telco-customer-churn-prediction"
  version: "1.0.0"
  random_seed: 42

paths:
  raw_data: "data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv"
  processed_train: "data/splits/train.csv"
  processed_val: "data/splits/val.csv"
  processed_test: "data/splits/test.csv"
  model_dir: "models"
  best_model: "models/best_churn_model.pkl"
  scaler: "models/scaler.pkl"
  encoder: "models/encoder.pkl"
  reports_dir: "reports"
  figures_dir: "reports/figures"

features:
  target: "Churn"
  id_col: "customerID"
  numerical_cols:
    - "tenure"
    - "MonthlyCharges"
    - "TotalCharges"
  categorical_cols:
    - "gender"
    - "SeniorCitizen"
    - "Partner"
    - "Dependents"
    - "PhoneService"
    - "MultipleLines"
    - "InternetService"
    - "OnlineSecurity"
    - "OnlineBackup"
    - "DeviceProtection"
    - "TechSupport"
    - "StreamingTV"
    - "StreamingMovies"
    - "Contract"
    - "PaperlessBilling"
    - "PaymentMethod"

data_split:
  test_size: 0.20
  val_size: 0.10
  stratify: true

training:
  cv_folds: 5
  optuna_trials: 30
  metric: "roc_auc"
